modules:
  jira:issueContext:
    - key: outrider-context-panel
      resource: panel
      resolver:
        function: panelResolver
      render: native
      title: Outrider
      description: Outrider prepares relevant context for this ticket.
      label: Outrider

  # Per-site settings (spec Phase 5.5). Only Jira admins can open it. useAsConfig adds a Configure button to
  # Outrider's entry in Jira's Manage apps list; the page is at /jira/settings/apps/configure/<appId>/<envId>.
  jira:adminPage:
    - key: outrider-settings
      resource: admin
      resolver:
        function: adminResolver
      render: native
      title: Outrider
      useAsConfig: true

  rovo:mcp:
    - key: outrider-mcp
      name: Outrider MCP
      tools:
        - get-ticket-context
        - find-related-incidents
        - find-similar-resolutions

  action:
    - key: get-ticket-context
      name: Get ticket context
      function: getTicketContext
      actionVerb: GET
      description: Retrieve source-grounded context for a JSM ticket.
      inputs:
        ticketKey:
          title: Ticket key
          description: The Jira issue key, e.g. ITS-123.
          type: string
          required: true
    - key: find-related-incidents
      name: Find related incidents
      function: findRelatedIncidents
      actionVerb: GET
      description: Find active and recently resolved incidents related to a Jira ticket or to a description of symptoms. Give a ticket key, keywords, or both. Returns only incidents the caller can see.
      inputs:
        ticketKey:
          title: Ticket key
          description: The Jira issue key, e.g. ITS-123. Optional if keywords are given.
          type: string
          required: false
        keywords:
          title: Keywords
          description: Symptoms or terms to match, e.g. "VPN disconnects after login". Optional if a ticket key is given.
          type: string
          required: false
    - key: find-similar-resolutions
      name: Find similar resolutions
      function: findSimilarResolutions
      actionVerb: GET
      description: Find previously resolved tickets with similar symptoms, with how they were fixed. Give a ticket key, a description of the problem, or both. Returns only tickets the caller can see.
      inputs:
        ticketKey:
          title: Ticket key
          description: The Jira issue key, e.g. ITS-123. Optional if a description is given.
          type: string
          required: false
        description:
          title: Description
          description: The problem in plain words, e.g. "users see a 503 error on the login page". Optional if a ticket key is given.
          type: string
          required: false

  trigger:
    - key: jira-issue-events
      function: onJiraIssueEvent
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue

  consumer:
    - key: outrider-build-consumer
      queue: outrider-build-queue
      function: buildJob

  function:
    - key: panelResolver
      handler: index.panelResolver
    - key: adminResolver
      handler: index.adminResolver

    - key: getTicketContext
      handler: index.getTicketContext
    - key: findRelatedIncidents
      handler: index.findRelatedIncidents
    - key: findSimilarResolutions
      handler: index.findSimilarResolutions

    - key: onJiraIssueEvent
      handler: index.onJiraIssueEvent

    - key: buildJob
      handler: index.buildJob
      timeoutSeconds: 600

resources:
  - key: panel
    path: src/frontend/index.jsx
  - key: admin
    path: src/frontend/admin.jsx

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/91f15c4b-555e-4db0-99e1-7567c801fc07

permissions:
  scopes:
    - read:jira-work
    - read:confluence-content.summary
    - read:confluence-content.all
    - read:space:confluence
    # Step 10: CQL search for knowledge articles, as the app (GET /wiki/rest/api/search).
    - search:confluence
    # Step 10: batch page fetch by ID, as the viewer (GET /wiki/api/v2/pages): read-time check and live text.
    - read:page:confluence
    # Step 11: Teamwork Graph, as the viewer only (atlassianTeamsBySpace): JiraSpace and AtlassianTeam object types.
    - read:graph:project:jira
    - read:graph:team:atlassian
    - storage:app
  # Summary generation: Amazon Bedrock via Mantle (spec §12.6), declared in remotes below.
  external:
    fetch:
      backend:
        - remote: bedrock-mantle
        # Step 12: embeddings for ranking (Jina AI), from the build job only.
        - remote: jina
remotes:
  # Must match MANTLE_BASE_URL in src/adapters/mantle.ts.
  - key: bedrock-mantle
    baseUrl: https://bedrock-mantle.us-east-1.api.aws
    operations:
      - fetch
  # Must match JINA_BASE_URL in src/adapters/jina.ts.
  - key: jina
    baseUrl: https://api.jina.ai
    operations:
      - fetch
