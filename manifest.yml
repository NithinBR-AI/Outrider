modules:
  jira:issueContext:
    - key: outrider-context-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Outrider
      description: Outrider prepares relevant context for this ticket.
      label: Outrider

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: src/frontend/index.jsx

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/91f15c4b-555e-4db0-99e1-7567c801fc07

permissions:
  scopes:
    - read:jira-work
    - read:confluence-content.summary
    - read:confluence-content.all
    - read:space:confluence
    - storage:app
